<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The native runtime applies its fixed, safe-area-aware viewport before mount. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="preload" href="../../packages/client/src/assets/fonts/product/untitled-sans-vf-roman.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="../../packages/client/src/assets/fonts/product/founders-grotesk-semibold.woff2" as="font" type="font/woff2" crossorigin />
    <title>Pinkslip</title>
    <script>
      // First-paint theme: mirror lib/theme.ts so CSS can rely on data-mode
      // alone (no FOUC, no duplicated prefers-color-scheme CSS).
      (function () {
        try {
          var mode = localStorage.getItem("pinkslip-theme");
          var resolved = mode === "light" || mode === "dark"
            ? mode
            : (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
          document.documentElement.setAttribute("data-mode", resolved);
        } catch (e) {
          document.documentElement.setAttribute("data-mode", "dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
