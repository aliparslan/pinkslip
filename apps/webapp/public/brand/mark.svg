    <linearGradient id="back" x1="66" y1="22" x2="162" y2="154" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FBE6EE"/><stop offset="1" stop-color="#F1CBDA"/></linearGradient>
    <linearGradient id="corner" x1="122" y1="164" x2="136" y2="178" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F6D3E0"/></linearGradient>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="1" dy="6" stdDeviation="5" flood-color="#6B1840" flood-opacity="0.3"/></filter>
