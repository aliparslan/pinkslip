name = "pinkslip"
main = "worker/index.ts"
compatibility_date = "2024-12-01"
routes = [
  { pattern = "pinkslip.alip.dev", custom_domain = true }
]

[assets]
directory = "./frontend/dist"

[[d1_databases]]
binding = "DB"
database_name = "pinkslip"
database_id = "fc0ff85d-0921-4b25-b4b2-c77a6ed28371"

[triggers]
crons = ["*/15 * * * *"]

[observability]
[observability.logs]
enabled = true
invocation_logs = true

[vars]
VAPID_SUBJECT = "mailto:aliparslan@outlook.com"
VAPID_PUBLIC_KEY = "BM8EzXoxkPPxG1IRS7CroVdKoLPNAs8AxDsZ6wlJB2uu2FyZyFAMXjdJvbg5Y0faVBbd28_GAwrrntFb1cBPVQU"

# ─── Native iOS push (APNs) ───────────────────────────────────────────────────
# Uncomment and fill in after Phase 0 (App ID + APNs Auth Key). The .p8 contents
# go in a secret, NOT here:  wrangler secret put APNS_PRIVATE_KEY
# Set APNS_SANDBOX = "true" for Xcode debug / direct-install device builds;
# leave it off (or "false") for TestFlight / App Store builds.
# APNS_KEY_ID = "XXXXXXXXXX"
# APNS_TEAM_ID = "YYYYYYYYYY"
# APNS_BUNDLE_ID = "dev.alip.pinkslip"
# APNS_SANDBOX = "true"
