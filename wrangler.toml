name = "pinkslip"
main = "worker/main.ts"
compatibility_date = "2026-08-27"
compatibility_flags = ["nodejs_compat"]
# No routes and no assets: since chunk 3.4 the web Worker (apps/webapp,
# `pinkslip-web`) owns pinkslip.work and pinkslip.alip.dev and forwards API
# paths here through its `API` service binding. Without routes Wrangler would
# default to a public workers.dev URL, so keep this Worker reachable only
# through that binding. A backend deploy can't take the site down.
workers_dev = false
preview_urls = false

[[d1_databases]]
binding = "DB"
database_name = "pinkslip"
database_id = "fc0ff85d-0921-4b25-b4b2-c77a6ed28371"

[[r2_buckets]]
binding = "RESUME_BUCKET"
bucket_name = "pinkslip-resumes"

[[send_email]]
name = "EMAIL"

[ai]
binding = "AI"

[triggers]
# Polling, notification matching, the every-minute dispatcher (watchdog,
# follow-ups, new-error alerts) and the 15-minute health checks
# (worker/health-checks.ts).
crons = ["*/15 * * * *", "2,17,32,47 * * * *", "* * * * *", "7,22,37,52 * * * *"]

# ─── Auto-apply server sends ──────────────────────────────────────────────────
# Cloudflare's headless browser (Browser Run) and the Workflow that runs one
# send, waiting for Greenhouse's emailed code when it asks for one.
[browser]
binding = "BROWSER"

[[workflows]]
name = "pinkslip-apply-send"
binding = "APPLY_SEND"
class_name = "ApplySendWorkflow"

# ─── Queue-based source polling ───────────────────────────────────────────────
# The every-minute cron dispatches due sources for the tiers listed in
# QUEUE_POLLING_TIERS; each source then polls in its own consumer invocation.
# Create the queues once before the first deploy that includes these bindings:
#   wrangler queues create pinkslip-source-poll-priority
#   wrangler queues create pinkslip-source-poll
#   wrangler queues create pinkslip-source-poll-dlq
#   wrangler queues create pinkslip-notify
[[queues.producers]]
binding = "SOURCE_POLL_PRIORITY_QUEUE"
queue = "pinkslip-source-poll-priority"

[[queues.producers]]
binding = "SOURCE_POLL_QUEUE"
queue = "pinkslip-source-poll"

[[queues.producers]]
binding = "NOTIFY_QUEUE"
queue = "pinkslip-notify"

# One source per invocation, so every poll gets its own CPU, memory, and
# subrequest budget. Adapter errors are acknowledged after quarantine
# bookkeeping; only failed D1 writes are retried.
[[queues.consumers]]
queue = "pinkslip-source-poll-priority"
max_batch_size = 1
max_retries = 3
dead_letter_queue = "pinkslip-source-poll-dlq"

[[queues.consumers]]
queue = "pinkslip-source-poll"
max_batch_size = 1
max_retries = 3
dead_letter_queue = "pinkslip-source-poll-dlq"

# New-job triggers from queued polls. One consumer at a time collapses a burst
# into a single matching run within about a second; the notification cron still
# sweeps the backlog if a trigger is ever lost.
[[queues.consumers]]
queue = "pinkslip-notify"
max_batch_size = 100
max_batch_timeout = 1
max_concurrency = 1
max_retries = 5
dead_letter_queue = "pinkslip-source-poll-dlq"

[observability]
enabled = true
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
[observability.traces]
enabled = true
head_sampling_rate = 0.05

[vars]
VAPID_SUBJECT = "mailto:aliparslan@outlook.com"
VAPID_PUBLIC_KEY = "BM8EzXoxkPPxG1IRS7CroVdKoLPNAs8AxDsZ6wlJB2uu2FyZyFAMXjdJvbg5Y0faVBbd28_GAwrrntFb1cBPVQU"
EMAIL_FROM_NAME = "Pinkslip"
EMAIL_FROM_ADDRESS = "login@pinkslip.work"
WORKERS_AI_MODEL = "@cf/zai-org/glm-4.7-flash"
# Poll tiers handled by the per-source queue instead of the 15-minute cron
# cycle. Removing a tier hands it back to the cron cycle on its next tick;
# that fallback is temporary and goes away once the queue path has proven out.
QUEUE_POLLING_TIERS = "1,2"
# Run Jev on Workers AI beside the rules for comparison. It never changes what
# users see. AI_MONTHLY_BUDGET_USD pauses it for the rest of the month once
# the month's model spend reaches the cap.
JOB_CLASSIFICATION_SHADOW = "true"
AI_MONTHLY_BUDGET_USD = "10"
# Production's values, set in the dashboard before they were kept here.
JEV_DAILY_CALL_LIMIT = "100"
JOB_CLASSIFICATION_AUDIT = "true"
# Recruiter outreach for admins only. While OUTREACH_TEST_RECIPIENT is set,
# it stands in for every recruiter's address: People lists the recruiters the
# owner confirmed, but every email is addressed here, so testing never
# reaches a real recruiter. Opening it to everyone (Decisions: Outreach #5)
# removes the stand-in and sets "on".
OUTREACH = "admin"
OUTREACH_TEST_RECIPIENT = "aliparslan@outlook.com"
# Assisted apply (the in-app browser's fill, Apply's sheet, Answers) for
# every signed-in user (owner, 2026-10-22). Submission stays manual unless
# AUTO_APPLY_SUBMIT is explicitly enabled separately.
AUTO_APPLY = "on"
# Server sends (step 10): Pinkslip's own browser fills and submits Greenhouse
# and Ashby applications (worker/apply/sends.ts). Admins only until the
# owner's own test applications have gone through (Decisions: Auto-apply #6).
AUTO_APPLY_SEND = "admin"
# Support Pinkslip (tips; docs/support-pinkslip-2026-10-22.md): only the
# owner sees the row while it's "admin". The Stripe Payment Links are public,
# named once_<dollars>, once_other and monthly_<dollars>; the app offers
# whichever exist. For now, one link where people type the amount.
SUPPORT = "admin"
SUPPORT_LINKS = { once_other = "https://buy.stripe.com/9B6eV7d1m2aA2Ti020eME00" }
# Tips of any amount, once or monthly: each is a price of this product,
# made for the tip (worker/support.ts), with the STRIPE_SECRET_KEY secret.
# The link above stays for builds up to 1.3.8, which read only links.
SUPPORT_STRIPE_PRODUCT = "prod_VUMG0vNuwRABSp"

# ─── Native iOS push (APNs) ───────────────────────────────────────────────────
# The .p8 contents go in a secret, NOT here:  wrangler secret put APNS_PRIVATE_KEY
# Leave APNS_SANDBOX off for TestFlight / App Store builds (production APNs).
APPLE_APP_ID = "dev.alip.pinkslip"
APPLE_TEAM_ID = "KV876H8952"
APPLE_SIGN_IN_CLIENT_ID = "dev.alip.pinkslip"
# A separate Sign in with Apple key is required for server-side authorization
# code exchange and account-deletion revocation. With it set, every iPhone
# Apple sign-in exchanges its code with this key, so a wrong key blocks them.
APPLE_SIGN_IN_KEY_ID = "K352A5SSTJ"
# The website's Services ID; setting it shows Sign in with Apple on the website.
APPLE_WEB_CLIENT_ID = "dev.alip.pinkslip.web"
# Secrets (never commit values): APPLE_SIGN_IN_PRIVATE_KEY,
# APPLE_TOKEN_ENCRYPTION_KEY (32 random bytes, base64url encoded).
APNS_TEAM_ID = "KV876H8952"
APNS_BUNDLE_ID = "dev.alip.pinkslip"
APNS_KEY_ID = "4T6886PU5Q"
# APNS_SANDBOX = "true"

# ─── Google sign-in (worker/google.ts) ─────────────────────────────────────────
# The OAuth client's ID. Its secret is a Worker secret, NOT here:
