name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Tests
        run: bun test

      - name: Typecheck and lint workspace
        run: bun run check

      - name: Build web app
        run: bun run build:frontend

      - name: Build iOS web bundle
        run: bun run build:ios
