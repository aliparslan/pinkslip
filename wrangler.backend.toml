# Backend-only deployment configuration. Cloudflare Worker versions normally
# bundle script and static assets together; keep_assets reuses the currently
# deployed web bundle so iOS/backend releases cannot accidentally publish local
# web work.
name = "pinkslip"
main = "worker/index.ts"
compatibility_date = "2026-08-27"
compatibility_flags = ["nodejs_compat"]
routes = [
  { pattern = "pinkslip.alip.dev", custom_domain = true },
  { pattern = "pinkslip.work", custom_domain = true }
]

[[d1_databases]]
binding = "DB"
database_name = "pinkslip"
database_id = "fc0ff85d-0921-4b25-b4b2-c77a6ed28371"

[[r2_buckets]]
binding = "RESUME_BUCKET"
bucket_name = "pinkslip-resumes"

[[send_email]]
name = "EMAIL"

[ai]
binding = "AI"

[triggers]
crons = ["*/15 * * * *", "2,17,32,47 * * * *"]

[observability]
enabled = true
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
[observability.traces]
enabled = true
head_sampling_rate = 0.05

[vars]
VAPID_SUBJECT = "mailto:aliparslan@outlook.com"
VAPID_PUBLIC_KEY = "BM8EzXoxkPPxG1IRS7CroVdKoLPNAs8AxDsZ6wlJB2uu2FyZyFAMXjdJvbg5Y0faVBbd28_GAwrrntFb1cBPVQU"
EMAIL_FROM_NAME = "pinkslip"
EMAIL_FROM_ADDRESS = "login@pinkslip.work"
WORKERS_AI_MODEL = "@cf/zai-org/glm-4.7-flash"
APPLE_APP_ID = "dev.alip.pinkslip"
APPLE_TEAM_ID = "KV876H8952"
APPLE_SIGN_IN_CLIENT_ID = "dev.alip.pinkslip"
APNS_TEAM_ID = "KV876H8952"
APNS_BUNDLE_ID = "dev.alip.pinkslip"
APNS_KEY_ID = "4T6886PU5Q"

[unsafe.metadata]
keep_assets = true
