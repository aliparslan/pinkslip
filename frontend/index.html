<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Zoom stays enabled on the web (WCAG 1.4.4); the Capacitor shell opts
         into the app-like fixed viewport at runtime (see lib/native-shell.ts). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#18171a" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="preload" href="/fonts/geist/geist-sans-variable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/geist/geist-pixel-square.woff2?v=2" as="font" type="font/woff2" crossorigin />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>pinkslip</title>
    <script>
      // First-paint theme: mirror lib/theme.ts so CSS can rely on data-mode
      // alone (no FOUC, no duplicated prefers-color-scheme CSS).
      (function () {
        try {
          var mode = localStorage.getItem("pinkslip-theme");
          var resolved = mode === "light" || mode === "dark"
            ? mode
            : (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
          document.documentElement.setAttribute("data-mode", resolved);
        } catch (e) {
          document.documentElement.setAttribute("data-mode", "dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
